[project]
name = "tema"
version = "0.1.0"
description = "Backend образовательной платформы Tema: команды, каналы, чаты, задания"
readme = "README.md"
authors = [{ name = "Ilya Zhirukhin" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tema = "tema:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "TC",
    "ASYNC", "S", "DTZ", "PL", "PERF", "FURB", "RUF", "FAST", "ANN",
]
ignore = [
    "PLR0913", "PLR0917",  # FastAPI-хендлеры принимают много зависимостей
    "PLR2004",
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях
    "TC001", "TC002", "TC003",  # FastAPI/Pydantic нужны типы в рантайме
    "PLC0415",  # ленивые импорты опциональных зависимостей (OTel, metrics)
    "ANN401",
    "S105", "S106",  # ложные срабатывания на token_type / access_token_url
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "PLR2004"]
"migrations/**" = ["ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["tema"]

[[tool.mypy.overrides]]
module = ["authlib.*", "asyncpg.*", "prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:authlib.*",
    "ignore:The httpx module is deprecated",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["tema"]
branch = true
